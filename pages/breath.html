<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23c1121f' stroke-width='14'/><line x1='22' y1='22' x2='78' y2='78' stroke='%23c1121f' stroke-width='14' stroke-linecap='round'/></svg>">
<title>Дыхание — Нет!</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../css/styles.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  body.breath-body {
    background: linear-gradient(180deg, #1a1a22 0%, #0f1525 45%, #081430 100%);
    color: #e8eaed;
    min-height: 100dvh;
    position: relative;
  }

  body.breath-body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(193,18,31,0.08), transparent 55%),
      radial-gradient(circle at 50% 100%, rgba(10,21,53,0.9), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .breath-body .back-btn {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.10);
    color: #e8eaed;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    top: max(20px, env(safe-area-inset-top));
    left: max(20px, env(safe-area-inset-left));
  }

  .breath-body .back-btn:hover {
    background: rgba(255,255,255,0.12);
  }

  .breath-wrap {
    position: relative;
    z-index: 1;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 50px;
    padding: 90px 20px 40px;
    box-sizing: border-box;
  }

  .breath-stage {
    position: relative;
    width: min(75vw, 340px);
    height: min(75vw, 340px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .breath-circle {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(193,18,31,0.35) 0%, rgba(193,18,31,0.85) 100%);
    box-shadow: 0 0 60px rgba(193,18,31,0.4), inset 0 0 40px rgba(255,255,255,0.15);
    transform: scale(0.5);
    will-change: transform;
    animation: breathPulse 14s ease-in-out infinite;
  }

  .breath-label {
    position: relative;
    z-index: 1;
    color: #fff;
    font-size: 26pt;
    font-weight: bold;
    letter-spacing: 1px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
    pointer-events: none;
  }

  .breath-counter {
    position: absolute;
    bottom: -36px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.55);
    font-size: 11pt;
    letter-spacing: 1px;
  }

  .breath-hint {
    color: rgba(255,255,255,0.7);
    font-size: 11pt;
    text-align: center;
    line-height: 1.6;
    max-width: 300px;
  }

  @keyframes breathPulse {
    0%     { transform: scale(0.5); }
    28.57% { transform: scale(1); }
    57.14% { transform: scale(1); }
    100%   { transform: scale(0.5); }
  }

  @media (max-width: 700px) {
    .breath-wrap { gap: 40px; padding: 80px 16px 30px; }
    .breath-label { font-size: 22pt; }
    .breath-hint { font-size: 10.5pt; }
  }
</style>
</head>
<body class="breath-body">

<a class="back-btn" href="../index.html" aria-label="Назад">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
  </svg>
</a>

<div class="breath-wrap">
  <div class="breath-stage">
    <div class="breath-circle"></div>
    <div class="breath-label" id="breath-label">Вдох</div>
    <div class="breath-counter" id="breath-counter">Цикл 1</div>
  </div>
  <div class="breath-hint">
    Вдох 4 сек — держи 4 сек — выдох 6 сек.<br>
    Просто смотри на круг и дыши вместе с ним.
  </div>
</div>

<script>
(function () {
  const label = document.getElementById('breath-label');
  const counter = document.getElementById('breath-counter');

  const INHALE = 4000;
  const HOLD = 4000;
  const EXHALE = 6000;

  let cycle = 0;
  let timer = null;

  function run() {
    label.textContent = 'Вдох';
    timer = setTimeout(() => {
      label.textContent = 'Держи';
      timer = setTimeout(() => {
        label.textContent = 'Выдох';
        timer = setTimeout(() => {
          cycle++;
          counter.textContent = 'Цикл ' + (cycle + 1);
          run();
        }, EXHALE);
      }, HOLD);
    }, INHALE);
  }

  // Останавливаем таймеры при уходе со страницы
  window.addEventListener('pagehide', () => {
    if (timer) clearTimeout(timer);
  });

  run();
})();
</script>
</body>
</html>
