<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23c1121f' stroke-width='14'/><line x1='22' y1='22' x2='78' y2='78' stroke='%23c1121f' stroke-width='14' stroke-linecap='round'/></svg>">
<title>Трезвость — Нет!</title>
<meta name="theme-color" content="#1b7a1b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<script src="../js/theme-init.js"></script>
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<a class="back-btn" href="../index.html" aria-label="Назад">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
  </svg>
</a>

<div class="counter-page">
  <div class="counter-card">

    <p class="counter-value" id="counter-value">1</p>
    <p class="counter-word" id="counter-word">день трезвости</p>
    <p class="counter-start" id="counter-start">с сегодняшнего дня</p>

    <div class="counter-divider"></div>

    <input type="date" id="counter-input" aria-label="Дата начала">

    <div class="counter-actions">
      <button class="primary" id="counter-change">Изменить дату начала</button>
      <button id="counter-reset">Сбросить на сегодня</button>
    </div>

  </div>
</div>

<script src="../js/sober.js" defer></script>
<script src="../js/app.js" defer></script>
<script src="../js/counter.js" defer></script>
</body>
</html>
