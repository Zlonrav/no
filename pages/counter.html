<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%231b7a1b' stroke-width='14'/><circle cx='50' cy='50' r='14' fill='%231b7a1b'/></svg>">
<title>Трезвость — Нет!</title>
<meta name="theme-color" content="#1b7a1b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<script src="../js/theme-init.js"></script>
<link rel="stylesheet" href="../css/styles.css">
<style>
  body.counter-body {
    padding: 0;
  }

  .counter-page {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 20px 40px;
    box-sizing: border-box;
  }

  .counter-card {
    position: relative;
    width: 100%;
    max-width: 420px;
    padding: 36px 32px 28px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--card-shadow);
    text-align: center;
  }

  .counter-card::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
    background: var(--green);
  }

  .counter-value {
    font-size: 96pt;
    font-weight: bold;
    color: var(--green);
    line-height: 1;
    letter-spacing: -3px;
    margin: 0;
    text-shadow: 0 4px 24px rgba(27,122,27,0.18);
  }

  .counter-word {
    font-size: 16pt;
    font-weight: bold;
    color: var(--text-main);
    margin: 12px 0 0;
    letter-spacing: 0.3px;
  }

  .counter-start {
    font-size: 11pt;
    color: var(--ui-color);
    margin: 10px 0 0;
    letter-spacing: 0.3px;
  }

  /* ===== Кнопка-карандаш ===== */
  .counter-edit {
    position: absolute;
    bottom: 16px;
    right: 16px;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--ui-color);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
    font-family: inherit;
    opacity: 0.65;
  }

  .counter-edit:hover {
    opacity: 1;
    color: var(--text-main);
    background: rgba(128,128,128,0.08);
  }

  .counter-edit:active {
    transform: scale(0.94);
  }

  .counter-edit svg {
    display: block;
    width: 18px;
    height: 18px;
  }

  /* Скрываем нативный input */
  #counter-input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    width: 1px;
    height: 1px;
  }

  /* ===== Оверлей подтверждения ===== */
  .counter-confirm {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(10,10,12,0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.2s ease;
  }

  .counter-confirm[hidden] { display: none; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .counter-confirm__box {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 24px 26px 20px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    border: 1px solid var(--card-border);
  }

  .counter-confirm__text {
    font-size: 12pt;
    line-height: 1.5;
    margin: 0 0 6px;
    color: var(--text-main);
    font-weight: bold;
  }

  .counter-confirm__date {
    font-size: 11pt;
    color: var(--green);
    font-weight: bold;
    margin: 0 0 20px;
    letter-spacing: 0.3px;
  }

  .counter-confirm__actions {
    display: flex;
    gap: 10px;
  }

  .counter-confirm__yes,
  .counter-confirm__no {
    flex: 1;
    font-family: inherit;
    font-size: 11pt;
    font-weight: bold;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--card-border);
    cursor: pointer;
    transition: transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .counter-confirm__yes {
    background: linear-gradient(135deg, #1f9e1f 0%, #0d5c0d 100%);
    color: #fff;
    border-color: transparent;
  }

  .counter-confirm__no {
    background: var(--card-bg);
    color: var(--text-main);
  }

  .counter-confirm__yes:active,
  .counter-confirm__no:active {
    transform: scale(0.97);
  }

  /* ===== БЛОК НАГРАД ===== */
.counter-awards-wrap {
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--card-h3-border);
}

.counter-awards {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  justify-items: center;
}

.award-shield {
  background: transparent;
  border: none;
  padding: 4px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease;
  -webkit-tap-highlight-color: transparent;
  border-radius: 8px;
}

.award-shield:hover {
  transform: translateY(-2px) scale(1.05);
}

.award-shield:active {
  transform: scale(0.95);
}

.award-shield.locked {
  opacity: 0.3;
  filter: grayscale(0.6);
}

.counter-awards-more {
  display: block;
  margin: 16px auto 0;
  background: transparent;
  border: none;
  color: var(--ui-color);
  font-family: inherit;
  font-size: 10pt;
  font-weight: bold;
  letter-spacing: 0.5px;
  cursor: pointer;
  padding: 6px 12px;
  transition: color 0.15s ease;
  -webkit-tap-highlight-color: transparent;
}

.counter-awards-more:hover {
  color: var(--text-main);
}

/* ===== ОВЕРЛЕЙ НАГРАДЫ ===== */
.award-overlay {
  position: fixed;
  inset: 0;
  z-index: 1100;
  background: rgba(10,10,12,0.7);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn 0.2s ease;
}

.award-overlay[hidden] { display: none; }

.award-overlay__close {
  position: absolute;
  top: 20px;
  right: 20px;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  font-size: 22pt;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease;
  padding: 0;
  font-family: inherit;
}

.award-overlay__close:hover {
  background: rgba(255,255,255,0.2);
}

.award-overlay__card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 32px 28px 28px;
  max-width: 320px;
  width: 100%;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.award-overlay__shield {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}

.award-overlay__name {
  font-size: 18pt;
  font-weight: bold;
  color: var(--text-main);
  margin: 0 0 8px;
  letter-spacing: 0.3px;
}

.award-overlay__status {
  font-size: 11pt;
  color: var(--ui-color);
  margin: 0;
  letter-spacing: 0.3px;
  line-height: 1.5;
}
  
  @media (max-width: 700px) {
    .counter-page { padding: 70px 16px 30px; }
    .counter-card { padding: 28px 24px 24px; border-radius: 14px; }
    .counter-value { font-size: 72pt; letter-spacing: -2px; }
    .counter-word { font-size: 14pt; }
    .counter-edit { bottom: 14px; right: 14px; width: 36px; height: 36px; }
    .counter-edit svg { width: 16px; height: 16px; }
    .counter-awards {
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
  }
</style>
</head>
<body class="counter-body">

<a class="back-btn" href="../index.html" aria-label="Назад">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
  </svg>
</a>

<div class="counter-page">
  <div class="counter-card">

    <p class="counter-value" id="counter-value">1</p>
    <p class="counter-word" id="counter-word">день трезвости</p>
    <p class="counter-start" id="counter-start">с сегодняшнего дня</p>

    <input type="date" id="counter-input" aria-label="Дата начала">

    <button class="counter-edit" id="counter-change" aria-label="Изменить дату">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/>
      </svg>
    </button>

  </div>
</div>

<div class="counter-awards-wrap">
  <div class="counter-awards" id="counter-awards"></div>
  <button class="counter-awards-more" id="counter-awards-more" hidden>Показать все</button>
</div>
  
<div class="counter-confirm" id="counter-confirm" hidden>
  <div class="counter-confirm__box">
    <p class="counter-confirm__text">Изменить дату?</p>
    <p class="counter-confirm__date" id="counter-confirm-date">—</p>
    <div class="counter-confirm__actions">
      <button class="counter-confirm__yes" id="counter-confirm-yes">Да</button>
      <button class="counter-confirm__no" id="counter-confirm-no">Нет</button>
    </div>
  </div>
</div>

<div class="award-overlay" id="award-overlay" hidden>
  <button class="award-overlay__close" id="award-overlay-close" aria-label="Закрыть">×</button>
  <div class="award-overlay__card" id="award-overlay-content"></div>
</div>
  
<script src="../js/awards.js" defer></script>
<script src="../js/sober.js" defer></script>
<script src="../js/app.js" defer></script>
<script src="../js/counter.js" defer></script>
</body>
</html>
