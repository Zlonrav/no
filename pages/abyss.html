<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23c1121f' stroke-width='14'/><line x1='22' y1='22' x2='78' y2='78' stroke='%23c1121f' stroke-width='14' stroke-linecap='round'/></svg>">
<title>Бездна — Нет!</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../css/styles.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  body.abyss-body {
    background: linear-gradient(180deg, #17171c 0%, #0f1525 45%, #081430 100%);
    color: #e8eaed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
  }

  /* Мягкое свечение из глубины */
  body.abyss-body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 35%, rgba(30,58,138,0.18), transparent 55%),
      radial-gradient(circle at 50% 100%, rgba(10,21,53,0.9), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .abyss-body .back-btn {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.10);
    color: #e8eaed;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }

  .abyss-body .back-btn:hover {
    background: rgba(255,255,255,0.12);
  }

  .abyss-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 720px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 90px 24px 40px;
    box-sizing: border-box;
    gap: 20px;
  }

  .abyss-textarea {
    flex: 1;
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: #e8eaed;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15pt;
    line-height: 1.6;
    resize: none;
    padding: 0;
    letter-spacing: 0.2px;
    transition:
      transform 2.8s cubic-bezier(0.5, 0, 0.75, 1),
      filter    2.8s ease-in,
      opacity   2.8s ease-in;
    will-change: transform, filter, opacity;
  }

  .abyss-textarea::placeholder {
    color: rgba(232, 234, 237, 0.28);
    font-style: italic;
  }

  .abyss-textarea.sinking {
    transform: translateY(100px) scale(0.98);
    filter: blur(12px);
    opacity: 0;
    pointer-events: none;
  }

  .abyss-button {
    font-family: inherit;
    font-size: 12pt;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 16px 32px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.10);
    background: linear-gradient(135deg, #1e2a4a 0%, #0a1535 100%);
    color: #e8eaed;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.3s ease, opacity 0.3s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    align-self: center;
    min-width: 200px;
    -webkit-tap-highlight-color: transparent;
  }

  .abyss-button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(30,58,138,0.4),
                0 0 0 1px rgba(255,255,255,0.15);
  }

  .abyss-button:active:not(:disabled) {
    transform: translateY(0) scale(0.98);
  }

  .abyss-button:disabled {
    opacity: 0.3;
    cursor: default;
  }

  @media (max-width: 700px) {
    .abyss-container { padding: 80px 20px 30px; gap: 16px; }
    .abyss-textarea { font-size: 13pt; }
    .abyss-button { padding: 14px 28px; font-size: 11pt; min-width: 180px; }
  }
</style>
</head>
<body class="abyss-body">

<a class="back-btn" href="../index.html" aria-label="Назад">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
  </svg>
</a>

<div class="abyss-container">
  <textarea
    id="abyss-input"
    class="abyss-textarea"
    placeholder="Напиши всё, что не даёт покоя. Это уйдёт навсегда"
    spellcheck="false"></textarea>
  <button id="abyss-release" class="abyss-button">Отпустить</button>
</div>

<script>
(function () {
  const input = document.getElementById('abyss-input');
  const btn = document.getElementById('abyss-release');
  let busy = false;

  /* Мягкий шёпот воды через Web Audio */
  function playWater() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const duration = 2.8;
      const size = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;

      const src = ctx.createBufferSource();
      src.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 900;
      filter.Q.value = 0.8;

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.055, ctx.currentTime + 0.6);
      gain.gain.linearRampToValueAtTime(0.035, ctx.currentTime + 1.6);
      gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + duration);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      src.start(0);
      src.stop(ctx.currentTime + duration);

      setTimeout(() => { try { ctx.close(); } catch (e) {} }, duration * 1000 + 200);
    } catch (e) {}
  }

  function release() {
    if (busy) return;
    if (!input.value.trim()) return;

    busy = true;
    btn.disabled = true;

    playWater();
    input.classList.add('sinking');

    setTimeout(() => {
      // Отключаем transition, чтобы очистка была мгновенной
      input.style.transition = 'none';
      input.value = '';
      input.classList.remove('sinking');
      void input.offsetWidth;
      input.style.transition = '';

      btn.disabled = false;
      busy = false;
    }, 2900);
  }

  btn.addEventListener('click', release);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      release();
    }
  });
})();
</script>
</body>
</html>
