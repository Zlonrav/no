<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23c1121f' stroke-width='14'/><line x1='22' y1='22' x2='78' y2='78' stroke='%23c1121f' stroke-width='14' stroke-linecap='round'/></svg>">
<title>Бездна — Нет!</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../css/styles.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  body.abyss-body {
    background: linear-gradient(180deg, #17171c 0%, #0f1525 45%, #081430 100%);
    color: #e8eaed;
    display: block;
    padding: 0;
    min-height: 100dvh;
    position: relative;
  }

  body.abyss-body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 35%, rgba(30,58,138,0.18), transparent 55%),
      radial-gradient(circle at 50% 100%, rgba(10,21,53,0.9), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .abyss-svg-defs {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .abyss-body .back-btn {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.10);
    color: #e8eaed;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    top: max(20px, env(safe-area-inset-top));
    left: max(20px, env(safe-area-inset-left));
  }

  .abyss-body .back-btn:hover {
    background: rgba(255,255,255,0.12);
  }

  /* ===== КНОПКА «ШЕПТАТЬ» ===== */
  .abyss-whisper {
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    right: max(20px, env(safe-area-inset-right));
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    color: #e8eaed;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
    font-family: inherit;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }

  .abyss-whisper:hover {
    background: rgba(255,255,255,0.12);
    transform: translateY(-1px);
  }

  .abyss-whisper:active {
    transform: scale(0.94);
  }

  .abyss-whisper svg {
    display: block;
    width: 22px;
    height: 22px;
  }

  .abyss-whisper.active {
    background: linear-gradient(135deg, #1e3a8a 0%, #0f1e4a 100%);
    border-color: rgba(120,160,255,0.35);
    color: #cfe0ff;
    box-shadow: 0 4px 16px rgba(30,58,138,0.55),
                0 0 0 1px rgba(120,160,255,0.20);
  }

  /* Заблокирована — когда в поле полоски (звук) */
  .abyss-whisper.disabled {
    opacity: 0.3;
    pointer-events: none;
  }

  /* ===== КОНТЕЙНЕР ===== */
  .abyss-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 90px 24px 28px;
    padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    gap: 16px;
  }

  .abyss-input-wrap {
    position: relative;
    flex: 1 1 0;
    min-height: 0;
    display: flex;
    overflow: hidden;
  }

  .abyss-textarea {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    min-height: 0;
    border: none;
    outline: none;
    background: transparent;
    color: #e8eaed;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15pt;
    line-height: 1.6;
    resize: none;
    padding: 5px;
    margin: 0;
    box-sizing: border-box;
    letter-spacing: 0.2px;
    overflow: hidden;
    transition:
      color       0.4s ease,
      text-shadow 0.4s ease,
      filter      0.4s ease,
      opacity     0.4s ease;
    will-change: color, text-shadow, filter, opacity;
  }

  /* ===== РЕЖИМ «ШЁПОТ» (textarea) ===== */
  .abyss-textarea.whispered {
    color: rgb(255 255 255 / 65%);
    text-shadow:
      0 0 2px  rgb(255 255 255),
      0 0 14px rgba(180, 200, 240, 0.30);
    filter: url(#abyss-whisper-filter);
  }

  /* Placeholder — остаётся чётким, совпадает с позицией текста */
  .abyss-placeholder {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 5px;
    box-sizing: border-box;
    pointer-events: none;
    color: rgba(232, 234, 237, 0.28);
    font-family: Arial, Helvetica, sans-serif;
    font-style: italic;
    font-size: 15pt;
    line-height: 1.6;
    letter-spacing: 0.2px;
    transition: opacity 0.3s ease;
    z-index: 3;
  }

  .abyss-placeholder.hidden {
    opacity: 0;
  }

  /* ===== СЦЕНА ДЛЯ АНИМАЦИИ ТЕКСТА ===== */
  .abyss-stage {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    overflow: hidden;
    padding: 5px;
    box-sizing: border-box;
    z-index: 4;
  }

  .abyss-line {
    display: block;
    color: #e8eaed;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15pt;
    line-height: 1.6;
    letter-spacing: 0.2px;
    white-space: pre-wrap;
    word-break: break-word;
    will-change: transform, opacity, color, text-shadow, filter;
    transition:
      transform    1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5),
      opacity      1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5),
      color        1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5),
      text-shadow  1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5),
      filter       1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5);
  }

  .abyss-line.sinking {
    transform: translateY(140px) scaleY(1.01);
    color: rgba(232, 234, 237, 0);
    opacity: 0;
  }

  /* Шёпот в сцене */
  .abyss-stage.whispered .abyss-line {
    color: rgb(255 255 255 / 65%);
    text-shadow:
      0 0 2px  rgb(255 255 255),
      0 0 14px rgba(180, 200, 240, 0.30);
    filter: url(#abyss-whisper-filter);
  }

  .abyss-stage.whispered .abyss-line.sinking {
    transform: translateY(140px) scaleY(1.01);
    color: rgb(255 255 255 / 0%);
    text-shadow:
      0 0 8px  rgba(255, 255, 255, 0.55),
      0 0 20px rgba(255, 255, 255, 0.30);
    opacity: 0;
  }

  /* ===== СЛОЙ ПОЛОСОК (звук) ===== */
  .voice-content {
    position: absolute;
    inset: 0;
    padding: 5px;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(auto-fill, 6px);
    grid-auto-rows: 80px;
    justify-content: space-between;
    align-content: start;
    gap: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 2;
  }

  .voice-cell {
    position: relative;
    width: 6px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .voice-line {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: linear-gradient(180deg, #ff4a5a 0%, #c1121f 100%);
    transition: height 0.05s linear;
    min-height: 4px;
  }

  /* ===== КНОПКИ ВНИЗУ ===== */
  .abyss-controls {
    display: flex;
    gap: 10px;
    flex: 0 0 auto;
  }

  .abyss-button {
    font-family: inherit;
    font-size: 12pt;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 16px 28px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.10);
    background: linear-gradient(135deg, #1e2a4a 0%, #0a1535 100%);
    color: #e8eaed;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.3s ease, opacity 0.3s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    flex: 1;
    -webkit-tap-highlight-color: transparent;
  }

  .abyss-button:hover:not(:disabled) {
    transform: translateY(-2px);
  }

  .abyss-button:active:not(:disabled) {
    transform: translateY(0) scale(0.98);
  }

  .abyss-button:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .abyss-button.rec {
    flex: 0 0 auto;
    width: auto;
    min-width: 0;
    aspect-ratio: 1 / 1;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  
  .abyss-button.rec svg {
    display: block;
    width: 24px;
    height: 24px;
    transition: transform 0.15s ease;
  }
  
  .abyss-button.rec.active {
    background: linear-gradient(135deg, #ff4a5a 0%, #c1121f 100%);
    border-color: transparent;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  @media (max-width: 700px) {
    .abyss-container {
      padding: 82px 18px 22px;
      padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      gap: 14px;
    }
    .abyss-textarea,
    .abyss-placeholder,
    .abyss-line { font-size: 13pt; }
    .abyss-button { padding: 14px 20px; font-size: 11pt; }
    .abyss-whisper { top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); width: 44px; height: 44px; }
    .abyss-whisper svg { width: 20px; height: 20px; }
    .abyss-body .back-btn { top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); }
  }
</style>
</head>
<body class="abyss-body">

<svg class="abyss-svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <filter id="abyss-whisper-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
</svg>

<a class="back-btn" href="../index.html" aria-label="Назад">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
  </svg>
</a>

<button class="abyss-whisper" id="abyss-whisper" title="Шептать" aria-label="Режим шёпота">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11c2 3 5.5 5 9 5s7-2 9-5"/>
    <path d="M6 13.5l-1.5 2"/>
    <path d="M9.5 15.2l-1 2.3"/>
    <path d="M12 16v2.5"/>
    <path d="M14.5 15.2l1 2.3"/>
    <path d="M18 13.5l1.5 2"/>
  </svg>
</button>

<div class="abyss-container">

  <div class="abyss-input-wrap" id="abyss-wrap">
    <div class="voice-content" id="voice-content"></div>
    <textarea
      id="abyss-input"
      class="abyss-textarea"
      spellcheck="false"></textarea>
    <div class="abyss-placeholder" id="abyss-placeholder">Напиши всё, что не даёт покоя. Или скажи голосом. Всё останется в бездне...</div>
  </div>

  <div class="abyss-controls">
    <button class="abyss-button rec" id="abyss-rec" type="button" aria-label="Говорить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="12" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0"/>
        <path d="M12 18v3"/>
        <path d="M8 21h8"/>
      </svg>
    </button>
    <button class="abyss-button" id="abyss-release">Отпустить</button>
  </div>

</div>

<script>
(function () {
  const wrap = document.getElementById('abyss-wrap');
  const input = document.getElementById('abyss-input');
  const content = document.getElementById('voice-content');
  const placeholder = document.getElementById('abyss-placeholder');
  const recBtn = document.getElementById('abyss-rec');
  const relBtn = document.getElementById('abyss-release');
  const whisperBtn = document.getElementById('abyss-whisper');

  let audioCtx = null;
  let analyser = null;
  let source = null;
  let stream = null;
  let rafId = null;
  let recording = false;
  let lastAdd = 0;
  let busy = false;

  const ADD_INTERVAL = 45;
  const MAX_LINES = 2000;

  /* ===== Режим: 'empty' | 'text' | 'voice' ===== */
  let mode = 'empty';

  function setMode(m) {
    mode = m;

    if (m === 'voice') {
      input.style.display = 'none';
      // Шёпот не действует на звук — блокируем кнопку
      whisperBtn.classList.add('disabled');
      recBtn.disabled = true;
      relBtn.disabled = false;
    } else if (m === 'text') {
      input.style.display = '';
      whisperBtn.classList.remove('disabled');
      recBtn.disabled = true;
      relBtn.disabled = false;
    } else {
      input.style.display = '';
      whisperBtn.classList.remove('disabled');
      recBtn.disabled = false;
      relBtn.disabled = true;
    }
  }

  /* ===== Шёпот ===== */
  function applyWhisper(on) {
    if (mode === 'voice') return; // не применяем к звуку
    input.classList.toggle('whispered', on);
    whisperBtn.classList.toggle('active', on);
    whisperBtn.title = on ? 'Шёпот включён' : 'Шептать';
    whisperBtn.setAttribute('aria-label', whisperBtn.title);
    try { localStorage.setItem('abyss-whisper', on ? '1' : '0'); } catch (e) {}
  }

  function getWhisper() {
    try { return localStorage.getItem('abyss-whisper') === '1'; }
    catch (e) { return false; }
  }

  applyWhisper(getWhisper());

  whisperBtn.addEventListener('click', () => {
    if (mode === 'voice') return;
    applyWhisper(!input.classList.contains('whispered'));
  });

  /* ===== Placeholder для текста ===== */
  function updatePlaceholder() {
    if (mode === 'voice') return;
    placeholder.classList.toggle('hidden', input.value.length > 0);
  }

  input.addEventListener('input', () => {
    if (input.value.length > 0 && mode === 'empty') {
      setMode('text');
    } else if (input.value.length === 0 && mode === 'text') {
      setMode('empty');
    }
    updatePlaceholder();
  });

  /* ===== Микрофон ===== */
  async function startMic() {
    if (busy || mode === 'text') return;

    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      alert('Не удалось получить доступ к микрофону. Разреши в браузере.');
      return;
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.6;

    source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);

    recording = true;
    recBtn.classList.add('active');
    recBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
    placeholder.classList.add('hidden');

    draw();
  }

  function stopMic() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    analyser = null;
    source = null;
    recording = false;

    recBtn.classList.remove('active');
    recBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/><path d="M8 21h8"/></svg>';

    // Если что-то записали — переходим в режим «звук»
    if (content.querySelectorAll('.voice-line').length > 0) {
      setMode('voice');
    } else {
      setMode('empty');
      placeholder.classList.remove('hidden');
    }
  }

  function draw() {
    const data = new Uint8Array(analyser.frequencyBinCount);

    function loop() {
      if (!analyser) return;
      analyser.getByteFrequencyData(data);

      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const avg = sum / data.length;

      const now = performance.now();
      if (now - lastAdd >= ADD_INTERVAL) {
        // Чувствительнее: усиливаем средний уровень в 3 раза
        const boosted = Math.min(255, avg * 2.5);
        const h = 4 + (boosted / 255) * 72;
        addLine(h);
        lastAdd = now;
      }

      rafId = requestAnimationFrame(loop);
    }
    loop();
  }

  function addLine(height) {
    const cell = document.createElement('div');
    cell.className = 'voice-cell';

    const el = document.createElement('span');
    el.className = 'voice-line';
    el.style.height = Math.max(4, height) + 'px';

    cell.appendChild(el);
    content.appendChild(cell);

    const cells = content.querySelectorAll('.voice-cell');
    if (cells.length > MAX_LINES) cells[0].remove();
  }

  /* ===== Уход: и текст, и полоски ===== */
  function release() {
    if (busy) return;

    const hasText = input.value.trim().length > 0;
    const hasVoice = content.querySelectorAll('.voice-line').length > 0;

    if (!hasText && !hasVoice) return;

    busy = true;
    relBtn.disabled = true;
    recBtn.disabled = true;

    if (hasText) {
      releaseText();
    } else {
      releaseVoice();
    }
  }

  /* ===== Уход текста ===== */
  function releaseText() {
    const text = input.value;
    const wasWhispered = input.classList.contains('whispered');

    const style = getComputedStyle(input);
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.font = style.fontWeight + ' ' + style.fontSize + ' ' + style.fontFamily;
    const letterSpacing = parseFloat(style.letterSpacing) || 0;
    const padLeft = parseFloat(style.paddingLeft) || 0;
    const padRight = parseFloat(style.paddingRight) || 0;
    const maxWidth = input.clientWidth - padLeft - padRight;

    function measure(str) {
      return ctx.measureText(str).width + (str.length - 1) * letterSpacing;
    }

    const visualLines = [];
    const logicalLines = text.split('\n');

    logicalLines.forEach(line => {
      if (line === '') { visualLines.push(''); return; }

      const words = line.split(' ');
      let current = '';

      words.forEach((word) => {
        const candidate = current ? current + ' ' + word : word;
        if (measure(candidate) <= maxWidth) {
          current = candidate;
        } else {
          if (current) visualLines.push(current);
          if (measure(word) > maxWidth) {
            let chunk = '';
            for (let c = 0; c < word.length; c++) {
              if (measure(chunk + word[c]) <= maxWidth) {
                chunk += word[c];
              } else {
                visualLines.push(chunk);
                chunk = word[c];
              }
            }
            current = chunk;
          } else {
            current = word;
          }
        }
      });
      if (current) visualLines.push(current);
    });

    const stage = document.createElement('div');
    stage.className = 'abyss-stage';
    if (wasWhispered) stage.classList.add('whispered');

    visualLines.forEach(line => {
      const div = document.createElement('div');
      div.className = 'abyss-line';
      div.textContent = line.length ? line : '\u00A0';
      stage.appendChild(div);
    });

    input.style.visibility = 'hidden';
    placeholder.style.display = 'none';
    wrap.appendChild(stage);

    playWater();

    const lines = stage.querySelectorAll('.abyss-line');
    const count = lines.length;
    const step = Math.max(0.12, Math.min(0.24, 2.2 / count));
    const lineDur = 1.6;

    lines.forEach((el, i) => {
      const reverseIndex = count - 1 - i;
      el.style.transitionDelay = (reverseIndex * step) + 's';
      void el.offsetWidth;
      el.classList.add('sinking');
    });

    const totalTime = (count - 1) * step + lineDur;

    setTimeout(() => {
      stage.remove();
      input.style.visibility = '';
      placeholder.style.display = '';
      input.value = '';
      updatePlaceholder();
      setMode('empty');
      busy = false;
    }, totalTime * 1000 + 250);
  }

  /* ===== Уход звука (полоски вниз) ===== */
  function releaseVoice() {
    const lines = Array.from(content.querySelectorAll('.voice-line'));
    if (!lines.length) return;

    playWater();

    const stage = document.createElement('div');
    stage.className = 'abyss-stage';

    const wrapRect = wrap.getBoundingClientRect();
    const positions = lines.map(el => {
      const r = el.getBoundingClientRect();
      return {
        x: r.left - wrapRect.left,
        y: r.top - wrapRect.top,
        w: r.width,
        h: r.height
      };
    });

    const rowMap = {};
    positions.forEach(p => {
      const key = Math.round(p.y / 4) * 4;
      if (!rowMap[key]) rowMap[key] = [];
      rowMap[key].push(p);
    });

    const rowKeys = Object.keys(rowMap).map(Number).sort((a, b) => a - b);
    const blocks = rowKeys.map(key => {
      const row = rowMap[key];
      const minX = Math.min(...row.map(p => p.x));
      const maxX = Math.max(...row.map(p => p.x + p.w));
      const minY = Math.min(...row.map(p => p.y));
      const maxY = Math.max(...row.map(p => p.y + p.h));

      const block = document.createElement('div');
      block.style.position = 'absolute';
      block.style.left = minX + 'px';
      block.style.top = minY + 'px';
      block.style.width = (maxX - minX) + 'px';
      block.style.height = (maxY - minY) + 'px';
      block.style.willChange = 'transform, opacity';
      block.style.transition =
        'transform 1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5), ' +
        'opacity 1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5)';

      row.forEach(p => {
        const copy = document.createElement('span');
        copy.style.position = 'absolute';
        copy.style.left = (p.x - minX) + 'px';
        copy.style.top = (p.y - minY) + 'px';
        copy.style.width = p.w + 'px';
        copy.style.height = p.h + 'px';
        copy.style.borderRadius = '2px';
        copy.style.background = 'linear-gradient(180deg, #ff4a5a 0%, #c1121f 100%)';
        block.appendChild(copy);
      });

      return block;
    });

    blocks.forEach(b => stage.appendChild(b));
    content.style.visibility = 'hidden';
    wrap.appendChild(stage);

    const count = blocks.length;
    const step = Math.max(0.12, Math.min(0.24, 2.2 / count));
    const lineDur = 1.6;

    blocks.forEach((block, i) => {
      const reverseIndex = count - 1 - i;
      block.style.transitionDelay = (reverseIndex * step) + 's';
      void block.offsetWidth;
      block.style.transform = 'translateY(140px)';
      block.style.opacity = '0';
    });

    const totalTime = (count - 1) * step + lineDur;

    setTimeout(() => {
      stage.remove();
      content.innerHTML = '';
      content.style.visibility = '';
      placeholder.classList.remove('hidden');
      setMode('empty');
      busy = false;
    }, totalTime * 1000 + 250);
  }

  /* ===== Звук воды ===== */
  function playWater() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const duration = 3.2;
      const size = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;

      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 850;
      filter.Q.value = 0.8;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 0.5);
      gain.gain.linearRampToValueAtTime(0.04, ctx.currentTime + 1.8);
      gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + duration);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(0);
      src.stop(ctx.currentTime + duration);
      setTimeout(() => { try { ctx.close(); } catch (e) {} }, duration * 1000 + 200);
    } catch (e) {}
  }

  /* ===== Обработчики ===== */
  recBtn.addEventListener('click', () => {
    if (recording) stopMic();
    else startMic();
  });

  relBtn.addEventListener('click', release);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      release();
    }
  });

  window.addEventListener('pagehide', stopMic);

  /* Стартовое состояние */
  setMode('empty');
  updatePlaceholder();
})();
</script>
