<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23c1121f' stroke-width='14'/><line x1='22' y1='22' x2='78' y2='78' stroke='%23c1121f' stroke-width='14' stroke-linecap='round'/></svg>">
<title>Голосовой ввод — тест</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../css/styles.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  body.voice-body {
    background: linear-gradient(180deg, #17171c 0%, #0f1525 45%, #081430 100%);
    color: #e8eaed;
    min-height: 100dvh;
    position: relative;
    font-family: Arial, Helvetica, sans-serif;
  }

  body.voice-body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 35%, rgba(30,58,138,0.18), transparent 55%),
      radial-gradient(circle at 50% 100%, rgba(10,21,53,0.9), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .voice-body .back-btn {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.10);
    color: #e8eaed;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    top: max(20px, env(safe-area-inset-top));
    left: max(20px, env(safe-area-inset-left));
  }

  .voice-page {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    padding: 80px 20px 40px;
    box-sizing: border-box;
    overflow-y: auto;
  }

  .voice-content {
    width: 100%;
    max-width: 480px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .voice-variant {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px;
  }

  .voice-variant__title {
    font-size: 10pt;
    font-weight: bold;
    color: rgba(255,255,255,0.5);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 0 14px;
    text-align: center;
  }

  /* ===== Общий стиль поля ===== */
  .voice-field {
    position: relative;
    min-height: 80px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
  }

  /* ===== Вариант 1 — вертикальные полоски ===== */
  .bars {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    height: 50px;
    width: 100%;
  }

  .bars span {
    display: block;
    width: 3px;
    min-height: 3px;
    border-radius: 3px;
    background: linear-gradient(180deg, #ff4a5a 0%, #c1121f 100%);
    transition: height 0.05s linear;
  }

  /* ===== Вариант 2 — круговая волна ===== */
  .circle-wave {
    position: relative;
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .circle-wave__ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid rgba(255,74,90,0.6);
    transition: transform 0.05s linear, opacity 0.05s linear;
    transform: scale(1);
    opacity: 0.5;
  }

  .circle-wave__dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: radial-gradient(circle, #ff4a5a 0%, #c1121f 100%);
    box-shadow: 0 0 20px rgba(255,74,90,0.6);
  }

  /* ===== Вариант 3 — горизонтальная линия ===== */
  .hline {
    position: relative;
    width: 100%;
    height: 50px;
    display: flex;
    align-items: center;
    gap: 2px;
    justify-content: center;
  }

  .hline span {
    display: block;
    width: 3px;
    min-height: 2px;
    border-radius: 3px;
    background: #ff4a5a;
    transition: height 0.05s linear;
  }

  /* ===== Кнопки ===== */
  .voice-controls {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .voice-btn {
    flex: 1;
    font-family: inherit;
    font-size: 11pt;
    font-weight: bold;
    letter-spacing: 0.5px;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: #e8eaed;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .voice-btn:hover {
    background: rgba(255,255,255,0.10);
  }

  .voice-btn:active {
    transform: scale(0.97);
  }

  .voice-btn.rec {
    background: linear-gradient(135deg, #c1121f 0%, #8a0f1a 100%);
    border-color: transparent;
    color: #fff;
  }

  .voice-btn.rec.active {
    background: linear-gradient(135deg, #ff4a5a 0%, #c1121f 100%);
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .voice-hint {
    font-size: 10pt;
    color: rgba(255,255,255,0.5);
    text-align: center;
    margin: 14px 0 0;
    line-height: 1.5;
  }
</style>
</head>
<body class="voice-body">

<a class="back-btn" href="../index.html" aria-label="Назад">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
  </svg>
</a>

<div class="voice-page">
  <div class="voice-content">

    <!-- Вариант 1 -->
    <div class="voice-variant">
      <p class="voice-variant__title">Вариант 1 — Вертикальные полоски</p>
      <div class="voice-field">
        <div class="bars" id="bars"></div>
      </div>
      <div class="voice-controls">
        <button class="voice-btn rec" data-target="bars" type="button">🎤 Говорить</button>
      </div>
    </div>

    <!-- Вариант 2 -->
    <div class="voice-variant">
      <p class="voice-variant__title">Вариант 2 — Круговая волна</p>
      <div class="voice-field">
        <div class="circle-wave">
          <div class="circle-wave__ring" id="ring"></div>
          <div class="circle-wave__dot"></div>
        </div>
      </div>
      <div class="voice-controls">
        <button class="voice-btn rec" data-target="ring" type="button">🎤 Говорить</button>
      </div>
    </div>

    <!-- Вариант 3 -->
    <div class="voice-variant">
      <p class="voice-variant__title">Вариант 3 — Горизонтальная линия</p>
      <div class="voice-field">
        <div class="hline" id="hline"></div>
      </div>
      <div class="voice-controls">
        <button class="voice-btn rec" data-target="hline" type="button">🎤 Говорить</button>
      </div>
    </div>

    <p class="voice-hint">
      Нажми «Говорить» — браузер спросит доступ к микрофону. Разреши. Полоски должны реагировать на голос.<br>
      Ничего не записывается и никуда не отправляется. Только визуализация уровня звука.
    </p>

  </div>
</div>

<script>
  /* ===== Создаём полоски ===== */
  function makeBars(container, count) {
    container.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      container.appendChild(s);
    }
    return container.querySelectorAll('span');
  }

  const barsEls = makeBars(document.getElementById('bars'), 40);
  const hlineEls = makeBars(document.getElementById('hline'), 60);
  const ring = document.getElementById('ring');

  /* ===== Аудио-контекст ===== */
  let audioCtx = null;
  let analyser = null;
  let source = null;
  let stream = null;
  let rafId = null;
  let activeBtn = null;

  async function startMic(btn) {
    if (activeBtn === btn) {
      stopMic();
      return;
    }

    if (activeBtn) stopMic();

    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      alert('Не удалось получить доступ к микрофону. Разреши в браузере.');
      return;
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.7;

    source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);

    activeBtn = btn;
    btn.classList.add('active');
    btn.textContent = '⏹ Остановить';

    draw(btn.dataset.target);
  }

  function stopMic() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;

    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    if (audioCtx) {
      audioCtx.close();
      audioCtx = null;
    }
    analyser = null;
    source = null;

    if (activeBtn) {
      activeBtn.classList.remove('active');
      activeBtn.textContent = '🎤 Говорить';
      activeBtn = null;
    }

    // Сброс визуала
    barsEls.forEach(s => s.style.height = '3px');
    hlineEls.forEach(s => s.style.height = '2px');
    if (ring) {
      ring.style.transform = 'scale(1)';
      ring.style.opacity = '0.5';
    }
  }

  function draw(target) {
    const data = new Uint8Array(analyser.frequencyBinCount);

    function loop() {
      if (!analyser) return;
      analyser.getByteFrequencyData(data);

      if (target === 'bars') {
        // Полоски разной высоты в зависимости от частоты
        barsEls.forEach((el, i) => {
          const v = data[i * 2] || 0;
          const h = 3 + (v / 255) * 45;
          el.style.height = h + 'px';
        });
      } else if (target === 'hline') {
        hlineEls.forEach((el, i) => {
          const v = data[Math.floor(i / 1.5)] || 0;
          const h = 2 + (v / 255) * 46;
          el.style.height = h + 'px';
        });
      } else if (target === 'ring') {
        // Средний уровень по всем частотам
        let sum = 0;
        for (let i = 0; i < data.length; i++) sum += data[i];
        const avg = sum / data.length;
        const scale = 1 + (avg / 255) * 0.8;
        const opacity = 0.3 + (avg / 255) * 0.7;
        ring.style.transform = 'scale(' + scale + ')';
        ring.style.opacity = opacity;
      }

      rafId = requestAnimationFrame(loop);
    }

    loop();
  }

  /* ===== Обработчики ===== */
  document.querySelectorAll('.voice-btn.rec').forEach(btn => {
    btn.addEventListener('click', () => startMic(btn));
  });

  window.addEventListener('pagehide', stopMic);
</script>
</body>
</html>
