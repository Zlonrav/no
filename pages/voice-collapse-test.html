<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23c1121f' stroke-width='14'/><line x1='22' y1='22' x2='78' y2='78' stroke='%23c1121f' stroke-width='14' stroke-linecap='round'/></svg>">
<title>Голос в Бездне — тест</title>
<meta name="theme-color" content="#0a0a0f">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="../css/styles.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  body.abyss-body {
    background: linear-gradient(180deg, #17171c 0%, #0f1525 45%, #081430 100%);
    color: #e8eaed;
    display: block;
    padding: 0;
    min-height: 100dvh;
    position: relative;
  }

  body.abyss-body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 50% 35%, rgba(30,58,138,0.18), transparent 55%),
      radial-gradient(circle at 50% 100%, rgba(10,21,53,0.9), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .abyss-svg-defs {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .abyss-body .back-btn {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.10);
    color: #e8eaed;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    top: max(20px, env(safe-area-inset-top));
    left: max(20px, env(safe-area-inset-left));
  }

  /* ===== КНОПКА «ШЕПТАТЬ» ===== */
  .abyss-whisper {
    position: fixed;
    top: max(20px, env(safe-area-inset-top));
    right: max(20px, env(safe-area-inset-right));
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
    color: #e8eaed;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.2s ease, color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    padding: 0;
    font-family: inherit;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }

  .abyss-whisper:hover {
    background: rgba(255,255,255,0.12);
    transform: translateY(-1px);
  }

  .abyss-whisper.active {
    background: linear-gradient(135deg, #1e3a8a 0%, #0f1e4a 100%);
    border-color: rgba(120,160,255,0.35);
    color: #cfe0ff;
  }

  .abyss-whisper svg {
    display: block;
    width: 22px;
    height: 22px;
  }

  /* ===== КОНТЕЙНЕР ===== */
  .abyss-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 90px 24px 28px;
    padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
    gap: 16px;
  }

.abyss-input-wrap {
  position: relative;
  flex: 1 1 0;
  min-height: 0;
  display: flex;
  overflow: hidden;
}

  .abyss-textarea {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    min-height: 0;
    border: none;
    outline: none;
    background: transparent;
    color: #e8eaed;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15pt;
    line-height: 1.6;
    resize: none;
    padding: 5px;
    margin: 0;
    box-sizing: border-box;
    overflow: hidden;
  }

  .abyss-textarea.whispered {
    color: rgb(255 255 255 / 65%);
    text-shadow:
      0 0 2px  rgb(255 255 255),
      0 0 14px rgba(180, 200, 240, 0.30);
    filter: url(#abyss-whisper-filter);
  }

  /* ===== Полоски-«буквы» внутри textarea ===== */
  .voice-content {
  position: absolute;
  inset: 0;
  padding: 5px;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: repeat(auto-fill, 6px);
  grid-auto-rows: 80px;
  justify-content: space-between;
  align-content: start;
  gap: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 2;
}

.voice-cell {
  position: relative;
  width: 6px;
  height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.voice-line {
  display: block;
  width: 3px;
  border-radius: 2px;
  background: linear-gradient(180deg, #ff4a5a 0%, #c1121f 100%);
  transition: height 0.05s linear;
  min-height: 4px;
}

  /* ===== Placeholder ===== */
  .abyss-placeholder {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 5px;
    box-sizing: border-box;
    pointer-events: none;
    color: rgba(232, 234, 237, 0.28);
    font-family: Arial, Helvetica, sans-serif;
    font-style: italic;
    font-size: 15pt;
    line-height: 1.6;
    transition: opacity 0.3s ease;
    z-index: 3;
  }

  .abyss-placeholder.hidden {
    opacity: 0;
  }

  /* ===== СЦЕНА УХОДА ===== */
  .abyss-stage {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    pointer-events: none;
    overflow: hidden;
    padding: 5px;
    box-sizing: border-box;
    z-index: 4;
  }

  .abyss-line {
    display: block;
    color: #e8eaed;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15pt;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    will-change: transform, opacity, color, text-shadow, filter;
    transition:
      transform    1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5),
      opacity      1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5),
      color        1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5),
      text-shadow  1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5),
      filter       1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5);
  }

  .abyss-line.sinking {
    transform: translateY(140px) scaleY(1.01);
    color: rgba(232, 234, 237, 0);
    opacity: 0;
  }

  /* ===== КНОПКИ ВНИЗУ ===== */
  .abyss-controls {
    display: flex;
    gap: 10px;
    flex: 0 0 auto;
  }

  .abyss-button {
    font-family: inherit;
    font-size: 12pt;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 16px 28px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.10);
    background: linear-gradient(135deg, #1e2a4a 0%, #0a1535 100%);
    color: #e8eaed;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.3s ease, opacity 0.3s ease;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    flex: 1;
    -webkit-tap-highlight-color: transparent;
  }

  .abyss-button:hover:not(:disabled) {
    transform: translateY(-2px);
  }

  .abyss-button:active:not(:disabled) {
    transform: translateY(0) scale(0.98);
  }

  .abyss-button:disabled {
    opacity: 0.3;
    cursor: default;
  }

  .abyss-button.rec {
    background: linear-gradient(135deg, #c1121f 0%, #8a0f1a 100%);
    border-color: transparent;
  }

  .abyss-button.rec.active {
    background: linear-gradient(135deg, #ff4a5a 0%, #c1121f 100%);
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  @media (max-width: 700px) {
    .abyss-container {
      padding: 82px 18px 22px;
      padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px));
      gap: 14px;
    }
    .abyss-placeholder { font-size: 13pt; }
    .abyss-button { padding: 14px 20px; font-size: 11pt; }
    .abyss-whisper { top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); width: 44px; height: 44px; }
    .abyss-whisper svg { width: 20px; height: 20px; }
    .abyss-body .back-btn { top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); }
  }
</style>
</head>
<body class="abyss-body">

<svg class="abyss-svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <filter id="abyss-whisper-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2"/>
    </filter>
  </defs>
</svg>

<a class="back-btn" href="../index.html" aria-label="Назад">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
  </svg>
</a>

<button class="abyss-whisper" id="abyss-whisper" title="Шептать" aria-label="Режим шёпота">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11c2 3 5.5 5 9 5s7-2 9-5"/>
    <path d="M6 13.5l-1.5 2"/>
    <path d="M9.5 15.2l-1 2.3"/>
    <path d="M12 16v2.5"/>
    <path d="M14.5 15.2l1 2.3"/>
    <path d="M18 13.5l1.5 2"/>
  </svg>
</button>

<div class="abyss-container">

  <div class="abyss-input-wrap" id="abyss-wrap">
    <div class="voice-content" id="voice-content"></div>
    <div class="abyss-placeholder" id="abyss-placeholder">Нажми «Говорить» и скажи, что не даёт покоя</div>
  </div>

  <div class="abyss-controls">
    <button class="abyss-button rec" id="abyss-rec" type="button">🎤 Говорить</button>
    <button class="abyss-button" id="abyss-release" disabled>Отпустить</button>
  </div>

</div>

<script>
(function () {
  const wrap = document.getElementById('abyss-wrap');
  const content = document.getElementById('voice-content');
  const placeholder = document.getElementById('abyss-placeholder');
  const recBtn = document.getElementById('abyss-rec');
  const relBtn = document.getElementById('abyss-release');
  const whisperBtn = document.getElementById('abyss-whisper');

  let audioCtx = null;
  let analyser = null;
  let source = null;
  let stream = null;
  let rafId = null;
  let recording = false;
  let lastAdd = 0;
  let busy = false;

  const ADD_INTERVAL = 45;
  const MAX_LINES = 2000;

  /* ===== Whisper ===== */
  function applyWhisper(on) {
    content.classList.toggle('whispered', on);
    whisperBtn.classList.toggle('active', on);
    try { localStorage.setItem('abyss-whisper', on ? '1' : '0'); } catch (e) {}
  }
  function getWhisper() {
    try { return localStorage.getItem('abyss-whisper') === '1'; }
    catch (e) { return false; }
  }
  applyWhisper(getWhisper());
  whisperBtn.addEventListener('click', () => {
    applyWhisper(!content.classList.contains('whispered'));
  });

  /* ===== Микрофон ===== */
  async function startMic() {
    if (busy) return;

    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      alert('Не удалось получить доступ к микрофону. Разреши в браузере.');
      return;
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.smoothingTimeConstant = 0.6;

    source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);

    recording = true;
    recBtn.classList.add('active');
    recBtn.textContent = '⏹ Стоп';
    relBtn.disabled = true;
    placeholder.classList.add('hidden');

    draw();
  }

  function stopMic() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    analyser = null;
    source = null;
    recording = false;

    recBtn.classList.remove('active');
    recBtn.textContent = '🎤 Говорить';

    // Если что-то записали — включаем «Отпустить»
    if (content.querySelectorAll('.voice-line').length > 0) {
      relBtn.disabled = false;
    } else {
      placeholder.classList.remove('hidden');
    }
  }

  function draw() {
    const data = new Uint8Array(analyser.frequencyBinCount);

    function loop() {
      if (!analyser) return;
      analyser.getByteFrequencyData(data);

      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const avg = sum / data.length;

      const now = performance.now();
      if (now - lastAdd >= ADD_INTERVAL) {
        const h = 4 + (avg / 255) * 72;
        addLine(h);
        lastAdd = now;
      }

      rafId = requestAnimationFrame(loop);
    }
    loop();
  }

  function addLine(height) {
    const cell = document.createElement('div');
    cell.className = 'voice-cell';

    const el = document.createElement('span');
    el.className = 'voice-line';
    el.style.height = Math.max(4, height) + 'px';

    cell.appendChild(el);
    content.appendChild(cell);

    const cells = content.querySelectorAll('.voice-cell');
    if (cells.length > MAX_LINES) cells[0].remove();
  }

  /* ===== Уход полосок вниз ===== */
  function release() {
    if (busy) return;
    const lines = Array.from(content.querySelectorAll('.voice-line'));
    if (!lines.length) return;

    busy = true;
    relBtn.disabled = true;

    playWater();

    // Создаём сцену поверх
    const stage = document.createElement('div');
    stage.className = 'abyss-stage';
    if (content.classList.contains('whispered')) stage.classList.add('whispered');

    // Считаем позиции всех полосок относительно wrap
    const wrapRect = wrap.getBoundingClientRect();
    const positions = lines.map(el => {
      const r = el.getBoundingClientRect();
      return {
        x: r.left - wrapRect.left,
        y: r.top - wrapRect.top,
        w: r.width,
        h: r.height
      };
    });

    // Группируем по верхнему краю — это строки
    const rowMap = {};
    positions.forEach(p => {
      const key = Math.round(p.y / 4) * 4;
      if (!rowMap[key]) rowMap[key] = [];
      rowMap[key].push(p);
    });

    // Создаём блоки строк
    const rowKeys = Object.keys(rowMap).map(Number).sort((a, b) => a - b);
    const blocks = rowKeys.map(key => {
      const row = rowMap[key];
      const minX = Math.min(...row.map(p => p.x));
      const maxX = Math.max(...row.map(p => p.x + p.w));
      const minY = Math.min(...row.map(p => p.y));
      const maxY = Math.max(...row.map(p => p.y + p.h));

      const block = document.createElement('div');
      block.className = 'abyss-line-block';
      block.style.position = 'absolute';
      block.style.left = minX + 'px';
      block.style.top = minY + 'px';
      block.style.width = (maxX - minX) + 'px';
      block.style.height = (maxY - minY) + 'px';
      block.style.willChange = 'transform, opacity';
      block.style.transition =
        'transform 1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5), ' +
        'opacity 1.6s cubic-bezier(0.55, 0.05, 0.85, 0.5)';

      // Копируем полоски внутрь блока
      row.forEach(p => {
        const copy = document.createElement('span');
        copy.className = 'voice-line-copy';
        copy.style.position = 'absolute';
        copy.style.left = (p.x - minX) + 'px';
        copy.style.top = (p.y - minY) + 'px';
        copy.style.width = p.w + 'px';
        copy.style.height = p.h + 'px';
        copy.style.borderRadius = '2px';
        copy.style.background = 'linear-gradient(180deg, #ff4a5a 0%, #c1121f 100%)';
        block.appendChild(copy);
      });

      return block;
    });

    blocks.forEach(b => stage.appendChild(b));
    content.style.visibility = 'hidden';
    wrap.appendChild(stage);

    // Уходим волной снизу вверх
    const count = blocks.length;
    const step = Math.max(0.12, Math.min(0.24, 2.2 / count));
    const lineDur = 1.6;

    blocks.forEach((block, i) => {
      const reverseIndex = count - 1 - i;
      block.style.transitionDelay = (reverseIndex * step) + 's';
      void block.offsetWidth;
      block.style.transform = 'translateY(140px)';
      block.style.opacity = '0';
    });

    const totalTime = (count - 1) * step + lineDur;

    setTimeout(() => {
      stage.remove();
      content.innerHTML = '';
      content.style.visibility = '';
      placeholder.classList.remove('hidden');
      relBtn.disabled = true;
      busy = false;
    }, totalTime * 1000 + 250);
  }

  /* ===== Звук воды ===== */
  function playWater() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const duration = 3.2;
      const size = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < size; i++) data[i] = Math.random() * 2 - 1;

      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 850;
      filter.Q.value = 0.8;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.06, ctx.currentTime + 0.5);
      gain.gain.linearRampToValueAtTime(0.04, ctx.currentTime + 1.8);
      gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + duration);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(0);
      src.stop(ctx.currentTime + duration);
      setTimeout(() => { try { ctx.close(); } catch (e) {} }, duration * 1000 + 200);
    } catch (e) {}
  }

  /* ===== Обработчики ===== */
  recBtn.addEventListener('click', () => {
    if (recording) stopMic();
    else startMic();
  });

  relBtn.addEventListener('click', release);

  window.addEventListener('pagehide', stopMic);
})();
</script>
</body>
</html>
