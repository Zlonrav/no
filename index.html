<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%23c1121f' stroke-width='14'/><line x1='22' y1='22' x2='78' y2='78' stroke='%23c1121f' stroke-width='14' stroke-linecap='round'/></svg>">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Нет!</title>
<meta name="theme-color" content="#c1121f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Нет!">
<meta name="mobile-web-app-capable" content="yes">
<script src="js/theme-init.js"></script>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-body">

<button class="theme-toggle" id="theme-btn" title="Тема" aria-label="Переключить тему"></button>
  
<main class="dashboard" id="dashboard"></main>
  
<script src="js/sober.js" defer></script>
<script src="js/app.js" defer></script>
<script src="js/dashboard.js" defer></script>

<div class="breath-overlay" id="breath-overlay" hidden>
  <button class="breath-close" id="breath-close" aria-label="Закрыть">×</button>
  <div class="breath-stage">
    <div class="breath-circle" id="breath-circle"></div>
    <div class="breath-label" id="breath-label">Вдох</div>
    <div class="breath-counter" id="breath-counter">Цикл 1</div>
  </div>
  <div class="breath-hint">
    Вдох 4 сек — держи 4 сек — выдох 6 сек.<br>
    Просто смотри на круг и дыши вместе с ним.
  </div>
</div>
  
</body>
</html>
